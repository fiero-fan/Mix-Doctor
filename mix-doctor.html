<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mix Doctor · AI Producer</title>
<style>
:root{
  color-scheme: light;
  --bg:#f3f2ef; --surface-1:#fcfcfb; --surface-2:#f0efec; --line:#dedcd6;
  --text-primary:#0b0b0b; --text-secondary:#52514e; --text-muted:#7a7974;
  --series-1:#2a78d6; --series-2:#eb6834; --range:#e4e2dc;
  --accent:#2a78d6; --hot:#eb6834; --good:#1b7a3f; --warn:#a86f00;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme: dark;
    --bg:#121211; --surface-1:#1a1a19; --surface-2:#232321; --line:#33332f;
    --text-primary:#f0efec; --text-secondary:#c3c2b7; --text-muted:#8f8e86;
    --series-1:#3987e5; --series-2:#d95926; --range:#2c2c29;
    --accent:#3987e5; --hot:#e0743f; --good:#4cc27a; --warn:#e0a43a;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text-primary);font:15px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:20px 20px 60px}
button{font:inherit}
.btn{padding:8px 13px;border-radius:9px;border:1px solid var(--line);background:var(--surface-1);color:var(--text-primary);cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--text-muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.rec{background:#e34948;border-color:#e34948;color:#fff;font-weight:600}
.btn:disabled{opacity:.5;cursor:default}
select,input.txt{max-width:100%;font:inherit;padding:7px 10px;border-radius:9px;border:1px solid var(--line);background:var(--surface-1);color:var(--text-primary)}
.muted{color:var(--text-muted);font-size:13px}
.hidden{display:none!important}
/* header */
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.top h1{font-size:24px;margin:0;letter-spacing:-.01em}
.seg{display:inline-flex;background:var(--surface-2);border-radius:11px;padding:3px}
.seg button{border:0;background:none;padding:7px 14px;border-radius:9px;color:var(--text-secondary);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--surface-1);color:var(--text-primary);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.input{margin-left:auto;display:flex;align-items:center;gap:10px;background:var(--surface-1);border:1px solid var(--line);border-radius:12px;padding:6px 8px 6px 12px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--text-muted);flex:0 0 9px}
.dot.on{background:#e34948;animation:p 1.2s infinite}
@keyframes p{50%{opacity:.35}}
.lvl{width:110px;height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.lvl div{height:100%;width:0;background:var(--accent);transition:width .08s}
/* rail */
.rail{display:flex;gap:6px;margin:0 0 16px;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface-1);border-radius:999px;padding:5px 12px 5px 6px;color:var(--text-secondary);cursor:pointer;font-size:14px}
.step b{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);font-size:12px}
.step.done b{background:var(--good);color:#fff}
.step.now{border-color:var(--accent);color:var(--text-primary);font-weight:600}
.step.now b{background:var(--accent);color:#fff}
.arrow{color:var(--text-muted);align-self:center}
/* layout */
.grid{display:grid;grid-template-columns:360px 1fr;gap:16px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:1fr}}
.card{background:var(--surface-1);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:16px}
.card h2{font-size:16px;margin:0 0 2px;display:flex;align-items:center;gap:8px}
.card h2 .n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);font-size:12px}
.card .sub{color:var(--text-secondary);font-size:13px;margin:0 0 12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hint{font-size:12.5px;color:var(--text-muted);background:var(--surface-2);border-radius:9px;padding:8px 10px;margin-top:10px}
.got{display:flex;align-items:center;gap:10px;margin-top:12px;padding:10px;border-radius:10px;background:var(--surface-2)}
.got input{flex:1;min-width:0;border:0;background:none;font:inherit;font-weight:600;color:var(--text-primary);padding:2px}
.prog{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin-top:10px}
.prog div{height:100%;width:0;background:#e34948}
.takes{list-style:none;margin:12px 0 0;padding:0}
.takes li{display:flex;justify-content:space-between;align-items:center;padding:7px 2px;border-top:1px solid var(--line);font-size:14px}
.takes li:first-child{border-top:0}
.up{color:var(--good);font-weight:600}.down{color:var(--hot);font-weight:600}
.err{color:var(--hot);font-size:13px;margin-top:8px}
/* compare */
.cmp-top{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.score{position:relative;width:96px;height:96px}
.score span{position:absolute;inset:0;display:grid;place-items:center;font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.verdict{font-size:18px;font-weight:600}
.legend{display:flex;gap:14px;font-size:13px;color:var(--text-secondary);margin:6px 0 2px;flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:3px;border-radius:2px;margin-right:6px;vertical-align:4px}
.chart{position:relative}
svg text{fill:var(--text-secondary);font-size:11px}
.tip{position:absolute;pointer-events:none;background:var(--surface-1);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:12px;box-shadow:0 4px 14px rgba(0,0,0,.15);display:none;white-space:nowrap;z-index:2}
.dims{display:grid;grid-template-columns:110px 1fr 120px;gap:2px 12px;align-items:center;margin-top:12px;font-size:14px}
.dims .lab{color:var(--text-primary)}
.dims .st{font-size:13px;text-align:right}
.track{position:relative;height:38px}
.track::before{content:"";position:absolute;left:0;right:0;top:10px;height:2px;background:var(--line);border-radius:1px}
.track .ok{position:absolute;top:6px;height:10px;background:var(--range);border-radius:5px}
.track .tg{position:absolute;top:2px;width:2px;height:18px;background:var(--series-2);margin-left:-1px;border-radius:1px}
.track .me{position:absolute;top:4px;width:14px;height:14px;border-radius:50%;background:var(--series-1);margin-left:-7px;border:2px solid var(--surface-1);transition:left .4s}
.track .was{position:absolute;top:5px;width:12px;height:12px;border-radius:50%;border:2px solid var(--series-1);margin-left:-6px;opacity:.45}
.track .ends{position:absolute;top:21px;left:0;right:0;display:flex;justify-content:space-between;font-size:10.5px;color:var(--text-muted)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:14px}
.stat{background:var(--surface-2);border-radius:10px;padding:9px 12px}
.stat .k{font-size:12px;color:var(--text-secondary)}
.stat .v{font-size:20px;font-weight:650;font-variant-numeric:tabular-nums}
.stat .h{font-size:12px;color:var(--text-muted)}
.empty{color:var(--text-muted);text-align:center;padding:34px 10px}
/* fix */
.fix{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:start}
@media (max-width:760px){.fix{grid-template-columns:1fr}}
.advice{display:grid;gap:8px;margin-bottom:14px}
.adv{display:flex;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface-1);border-radius:10px;padding:8px 10px;cursor:pointer;color:var(--text-primary)}
.adv:hover{border-color:var(--text-muted)}
.adv .num{width:24px;height:24px;border-radius:50%;background:var(--hot);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;flex:0 0 24px}
.adv i{width:6px;align-self:stretch;border-radius:3px;flex:0 0 6px}
.adv b{display:block;font-size:14.5px}
.adv small{color:var(--text-muted);font-size:12.5px}
.mixer{display:flex;gap:10px;background:#1d1d1f;border-radius:14px;padding:12px;width:fit-content;max-width:100%;overflow-x:auto}
.strip{width:170px;flex:0 0 170px;background:#2a2a2d;border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px}
.strip .lbl{font-size:11px;color:#a1a1a6;text-transform:uppercase;letter-spacing:.06em;margin:2px 2px 0}
.strip .nm{color:#f5f5f7;font-weight:600;font-size:14px;text-align:center;padding:6px 0 2px;border-top:1px solid #3a3a3d;margin-top:4px}
.slot{display:flex;align-items:center;gap:7px;border:0;border-radius:6px;padding:7px 8px;background:#3a3a3e;color:#f5f5f7;font-size:13px;text-align:left;cursor:pointer;position:relative}
.slot:hover{background:#46464b}
.slot[aria-pressed=true]{outline:2px solid #fff;outline-offset:1px}
.slot i{width:6px;align-self:stretch;border-radius:3px;flex:0 0 6px}
.slot small{display:block;color:#a1a1a6;font-size:11px}
.slot .bdg{position:absolute;right:-6px;top:-6px;display:flex;gap:2px}
.slot .bdg span{width:18px;height:18px;border-radius:50%;background:var(--hot);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;box-shadow:0 0 0 2px #2a2a2d}
.slot.add{background:transparent;border:1px dashed #5a5a5e;color:#a1a1a6;cursor:default;font-size:12px}
.send{display:flex;justify-content:space-between;background:#323236;border-radius:6px;padding:5px 8px;color:#d1d1d6;font-size:12px}
.fader{height:60px;display:flex;justify-content:center;align-items:flex-end;margin-top:4px}
.fader div{width:6px;height:100%;background:#1d1d1f;border-radius:3px;position:relative}
.fader div::after{content:"";position:absolute;left:-9px;width:24px;height:12px;border-radius:3px;background:#c7c7cc;bottom:62%}
.detail h3{margin:0;font-size:18px;display:flex;align-items:center;gap:8px}
.detail h3 i{width:12px;height:12px;border-radius:3px;display:inline-block}
.detail .role{color:var(--text-secondary);margin:2px 0 12px;font-size:14px}
.knobs{display:flex;gap:12px;flex-wrap:wrap}
.knob{width:88px;text-align:center;position:relative;border-radius:10px;padding:4px 0}
.knob.hit{background:color-mix(in srgb,var(--hot) 14%,transparent)}
.knob .kv{font-weight:650;font-size:14px;font-variant-numeric:tabular-nums}
.knob .kl{font-size:12px;color:var(--text-muted)}
.knob .go{position:absolute;top:2px;right:4px;background:var(--hot);color:#fff;border-radius:6px;font-size:12px;font-weight:700;padding:0 5px}
.extra{margin-top:10px;font-size:13px;color:var(--text-secondary);background:var(--surface-2);border-radius:8px;padding:7px 10px}
.chk{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
#yt-box details summary{font-size:14px;color:var(--text-primary);font-weight:600;margin-top:12px}
.yt{position:relative;padding-top:56.25%;border-radius:10px;overflow:hidden;background:#000;margin-top:10px}
.yt iframe,.yt>div{position:absolute;inset:0;width:100%;height:100%}
.snip{display:grid;grid-template-columns:auto 1fr auto;gap:6px 8px;align-items:center;margin:10px 0}
.snip input{width:100%;font:inherit;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface-1);color:var(--text-primary);font-variant-numeric:tabular-nums}
.btn.sm{padding:5px 9px;font-size:13px}
details summary{cursor:pointer;color:var(--text-secondary);font-size:13px;margin-top:14px}
textarea{width:100%;min-height:90px;font:13px/1.4 ui-monospace,Menlo,monospace;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--surface-1);color:var(--text-primary);margin-top:6px}
</style>
</head>
<body>
<div class="wrap">

<div class="top">
  <h1>Mix Doctor</h1>
  <div class="seg" role="group" aria-label="What are you doing?">
    <button id="ctx-tone" aria-pressed="true">Match a sound</button>
    <button id="ctx-mix" aria-pressed="false">Check my mix</button>
  </div>
  <div class="input">
    <span class="dot" id="in-dot"></span>
    <span class="muted" id="in-name">Input not connected</span>
    <div class="lvl" title="Input level"><div id="in-lvl"></div></div>
    <select id="in-dev" class="hidden"></select>
    <button class="btn" id="in-btn">Connect</button>
  </div>
</div>

<div class="rail" id="rail"></div>

<div class="grid">
  <div>
    <!-- 1 TARGET -->
    <div class="card" id="c-target"><div id="c-target-main"></div>
      <div id="yt-box"><details id="yt-det" open><summary>Target from a YouTube clip</summary>
        <div class="row" style="margin-top:8px"><input class="txt" id="yt-url" placeholder="Paste a YouTube link" style="flex:1;min-width:0"><button class="btn" id="yt-load">Load</button></div>
        <div id="yt-wrap" class="hidden"><div class="yt"><div id="yt-player"></div></div>
          <div class="snip"><span class="muted">Start</span><input id="yt-start" value="0:00" inputmode="numeric"><button class="btn sm" data-now="start">⏱ now</button>
            <span class="muted">End</span><input id="yt-end" placeholder="0:20" inputmode="numeric"><button class="btn sm" data-now="end">⏱ now</button></div>
          <div class="row"><button class="btn" id="yt-play">▶ Play snippet</button><button class="btn rec" id="yt-learn">● Learn this snippet</button></div>
          <div class="muted" id="yt-msg" style="margin-top:6px"></div></div>
        <div class="hint" id="yt-hint">Your Mac's sound output must be the <b>Multi-Output Device</b>, so BlackHole hears YouTube.</div>
      </details></div></div>
    <!-- 2 YOU -->
    <div class="card" id="c-you"></div>
  </div>
  <div>
    <!-- 3 COMPARE -->
    <div class="card" id="c-compare"></div>
  </div>
</div>
<!-- 4 FIX + 5 CHECK -->
<div class="card" id="c-fix"></div>

<p class="muted" id="env"></p>
</div>

<script>
"use strict";
/* ===================================================================== DSP */
class Biquad{
  constructor(b0,b1,b2,a1,a2){Object.assign(this,{b0,b1,b2,a1,a2});this.z1=0;this.z2=0}
  run(x,y){let {b0,b1,b2,a1,a2,z1,z2}=this;
    for(let i=0;i<x.length;i++){const v=x[i],o=b0*v+z1;z1=b1*v-a1*o+z2;z2=b2*v-a2*o;y[i]=o}
    this.z1=z1;this.z2=z2;return y}}
function norm(b,a){return new Biquad(b[0]/a[0],b[1]/a[0],b[2]/a[0],a[1]/a[0],a[2]/a[0])}
function kWeight(sr){ // ITU-R BS.1770-4 K-weighting
  const G=3.999843853973347,Q=0.7071752369554196,fc=1681.974450955533;
  const A=10**(G/40);let w0=2*Math.PI*fc/sr,al=Math.sin(w0)/(2*Q),c=Math.cos(w0),sA=Math.sqrt(A);
  const s=norm([A*((A+1)+(A-1)*c+2*sA*al),-2*A*((A-1)+(A+1)*c),A*((A+1)+(A-1)*c-2*sA*al)],
               [(A+1)-(A-1)*c+2*sA*al,2*((A-1)-(A+1)*c),(A+1)-(A-1)*c-2*sA*al]);
  const Q2=0.5003270373238773,f2=38.13547087602444;w0=2*Math.PI*f2/sr;al=Math.sin(w0)/(2*Q2);c=Math.cos(w0);
  return [s,norm([(1+c)/2,-(1+c),(1+c)/2],[1+al,-2*c,1-al])]}
function lowpass(sr,f,Q){const w0=2*Math.PI*f/sr,al=Math.sin(w0)/(2*Q),c=Math.cos(w0);return norm([(1-c)/2,1-c,(1-c)/2],[1+al,-2*c,1-al])}
function lp120(sr){return [lowpass(sr,120,0.5412),lowpass(sr,120,1.3065)]}
function chain(filters,x){let y=new Float32Array(x.length);let src=x;for(const f of filters){f.run(src,y);src=y}return y}
const TP_TAPS=(()=>{const t=[];for(const p of [0.25,0.5,0.75]){const c=[];let s=0;
  for(let k=-5;k<=6;k++){const d=p-k;const sinc=d===0?1:Math.sin(Math.PI*d)/(Math.PI*d);const w=0.5+0.5*Math.cos(Math.PI*d/6.5);c.push(sinc*w);s+=sinc*w}
  t.push(c.map(v=>v/s))}return t})();
function truePeakOf(x,samplePeak){let m=samplePeak;const thr=samplePeak*0.5,n=x.length;
  for(let i=5;i<n-7;i++){const a=Math.abs(x[i]),b=Math.abs(x[i+1]);if(a<thr&&b<thr)continue;
    for(const c of TP_TAPS){let v=0;for(let k=0;k<12;k++)v+=c[k]*x[i-5+k];v=Math.abs(v);if(v>m)m=v}}
  return m}
function fft(re,im){const n=re.length;
  for(let i=1,j=0;i<n;i++){let bit=n>>1;for(;j&bit;bit>>=1)j^=bit;j^=bit;if(i<j){[re[i],re[j]]=[re[j],re[i]];[im[i],im[j]]=[im[j],im[i]]}}
  for(let len=2;len<=n;len<<=1){const ang=-2*Math.PI/len,wr=Math.cos(ang),wi=Math.sin(ang);
    for(let i=0;i<n;i+=len){let cr=1,ci=0;for(let j=0;j<len/2;j++){const a=i+j,b=a+len/2;
      const tr=re[b]*cr-im[b]*ci,ti=re[b]*ci+im[b]*cr;re[b]=re[a]-tr;im[b]=im[a]-ti;re[a]+=tr;im[a]+=ti;
      const nr=cr*wr-ci*wi;ci=cr*wi+ci*wr;cr=nr}}}}
const BANDS=[["sub",20,60],["bass",60,250],["low-mids",250,500],["mids",500,2000],["upper-mids",2000,4000],["presence",4000,8000],["air",8000,20000]];
function bandPowers(power,binHz,sr){const out={};for(const [name,lo,hi0] of BANDS){const hi=Math.min(hi0,sr/2);let s=0;
    for(let k=Math.ceil(lo/binHz);k*binHz<hi&&k<power.length;k++)s+=power[k];out[name]=s/Math.log2(hi/lo)}return out}
function relToMids(p){const out={},r=10*Math.log10(p.mids+1e-30);for(const k in p)out[k]=Math.round((10*Math.log10(p[k]+1e-30)-r)*10)/10;return out}
function spectrumBands(mono,sr){const N=8192,win=new Float32Array(N);for(let i=0;i<N;i++)win[i]=0.5-0.5*Math.cos(2*Math.PI*i/N);
  const pw=new Float64Array(N/2),re=new Float64Array(N),im=new Float64Array(N);
  for(let s=0;s+N<=mono.length;s+=N){for(let i=0;i<N;i++){re[i]=mono[s+i]*win[i];im[i]=0}fft(re,im);for(let k=0;k<N/2;k++)pw[k]+=re[k]*re[k]+im[k]*im[k]}
  return relToMids(bandPowers(pw,sr/N,sr))}
const dB=v=>Math.max(20*Math.log10(Math.max(v,1e-12)),-120);
const r1=v=>Math.round(v*10)/10;
function gatedIntegrated(b){let l=b.filter(v=>v>-70);if(!l.length)return -70;
  const rel=10*Math.log10(l.reduce((a,v)=>a+10**(v/10),0)/l.length)-10;l=l.filter(v=>v>rel);
  return 10*Math.log10(l.reduce((a,v)=>a+10**(v/10),0)/l.length)}
function lra(st){let l=st.filter(v=>v>-70);if(l.length<2)return 0;
  const rel=10*Math.log10(l.reduce((a,v)=>a+10**(v/10),0)/l.length)-20;l=l.filter(v=>v>rel).sort((a,b)=>a-b);
  const q=p=>l[Math.min(l.length-1,Math.max(0,Math.round(p*(l.length-1))))];return q(.95)-q(.10)}
function stereoFrom(L,R,sr){let sl=0,sr2=0,slr=0,mL=0,mR=0,n=L.length;for(let i=0;i<n;i++){mL+=L[i];mR+=R[i]}mL/=n;mR/=n;
  let sm=0,ss=0;const M=new Float32Array(n),S=new Float32Array(n);
  for(let i=0;i<n;i++){const a=L[i]-mL,b=R[i]-mR;sl+=a*a;sr2+=b*b;slr+=a*b;M[i]=(L[i]+R[i])/2;S[i]=(L[i]-R[i])/2;sm+=M[i]*M[i];ss+=S[i]*S[i]}
  const corr=(sl>0&&sr2>0)?slr/Math.sqrt(sl*sr2):1;
  const Ml=chain(lp120(sr),M),Sl=chain(lp120(sr),S);let a=0,b=0;for(let i=0;i<n;i++){a+=Ml[i]*Ml[i];b+=Sl[i]*Sl[i]}
  return {mono_file:false,correlation:Math.round(corr*100)/100,side_vs_mid_db:r1(dB(Math.sqrt(ss/n))-dB(Math.sqrt(sm/n))),low_end_side_vs_mid_db:r1(dB(Math.sqrt(b/n))-dB(Math.sqrt(a/n)))}}
// Whole-song analysis (loudness, peaks, tone vs mids, stereo)
function analyzeBuffer(buf,name){
  const sr=buf.sampleRate,ch=Math.min(buf.numberOfChannels,2);const chans=[];for(let c=0;c<ch;c++)chans.push(buf.getChannelData(c));

  for(const x of chans){const xk=chain(kWeight(sr),x);

    for(let i=0;i<n;i++){const a=Math.abs(x[i]);if(a>peak)peak=a;if(a>=0.999)clipped++}}
  const lk=ms=>-0.691+10*Math.log10(Math.max(ms,1e-12));const avg=(j,w)=>{let s=0;for(let k=j;k<j+w;k++)s+=z[k];return s/w};

  const I=gatedIntegrated(b400);let tp=0;for(const x of chans)tp=Math.max(tp,truePeakOf(x,peak));
  const mono=new Float32Array(n);for(const x of chans)for(let i=0;i<n;i++)mono[i]+=x[i]/ch;

    loudness:{integrated_lufs:r1(I),true_peak_dbtp:r1(dB(tp)),loudness_range_lu:r1(lra(st)),plr_db:r1(dB(tp)-I),max_short_term_lufs:st.length?r1(Math.max(...st)):null,clipped_samples:clipped},
    tone_vs_mids_db:spectrumBands(mono,sr),stereo:ch<2?{mono_file:true,side_vs_mid_db:-60,low_end_side_vs_mid_db:-60,correlation:1}:stereoFrom(chans[0],chans[1],sr)}}

// Sound "fingerprint": loudness-independent tone, grit, sustain, space, width (only where there's real sound)
const OCT=[40,80,160,320,640,1280,2560,5120,10240,16000],OCT_LBL=["40","80","160","320","640","1.3k","2.6k","5k","10k"];
function profileFrom(buf){
  const sr=buf.sampleRate,L=buf.getChannelData(0),R=buf.numberOfChannels>1?buf.getChannelData(1):L,n=L.length;

  const pct=(a,p)=>a[Math.min(a.length-1,Math.max(0,Math.floor(p*(a.length-1))))];
  const sorted=Array.from(fdb).sort((a,b)=>a-b);if(!sorted.length)return null;
  const p95=pct(sorted,.95),thr=Math.max(-60,p95-30);
  const act=[];let first=-1,last=-1;for(let f=0;f<nf;f++)if(fdb[f]>thr){act.push(fdb[f]);if(first<0)first=f;last=f}
  const activeSec=act.length*0.05;if(activeSec<2)return {tooQuiet:true,activeSec};
  act.sort((a,b)=>a-b);const dyn=pct(act,.9)-pct(act,.1);
  const region=Array.from(fdb.slice(first,last+1)).sort((a,b)=>a-b);const space=pct(region,.15)-pct(region,.9);

  const N=4096,win=new Float32Array(N);for(let i=0;i<N;i++)win[i]=0.5-0.5*Math.cos(2*Math.PI*i/N);

  let sm=0,ss=0,sl=0,sr2=0,slr=0;
  for(let s=0;s+N<=n;s+=N){let e=0;for(let i=0;i<N;i++){const m=(L[s+i]+R[s+i])/2;e+=m*m}
    if(10*Math.log10(e/N+1e-20)<=thr)continue;cnt++;
    for(let i=0;i<N;i++){const l=L[s+i],r=R[s+i],m=(l+r)/2,d=(l-r)/2;re[i]=m*win[i];im[i]=0;sm+=m*m;ss+=d*d;sl+=l*l;sr2+=r*r;slr+=l*r}

  const raw=[];for(let i=0;i<OCT.length-1;i++)raw.push(10*Math.log10(sum(OCT[i],OCT[i+1])/Math.log2(OCT[i+1]/OCT[i])+1e-30));

  let lg=0,ar=0,nb=0;for(let k=Math.ceil(1000/bh);k*bh<5000;k++){lg+=Math.log(pw[k]+1e-30);ar+=pw[k];nb++}

  return {curve,centroid:cn/cd,low:share(40,120),body:share(150,500),bite:share(1500,5000),fizz:share(6000,16000),grit,dyn,space,
    width:Math.max(-30,10*Math.log10((ss+1e-20)/(sm+1e-20))),corr:sl>0&&sr2>0?slr/Math.sqrt(sl*sr2):1,activeSec}}

  row("body","Body","thinner","muddier",y.body-t.body,2,10,[["eq","300 Hz","↓"],["amp","Bass","↓"]],[["amp","Mids","↑"]]),
  row("bite","Bite","softer","harsher",y.bite-t.bite,2,10,[["eq","3 kHz","↓"],["amp","Presence","↓"]],[["amp","Presence","↑"],["amp","Mids","↑"]]),
  row("fizz","Fizz / air","duller","fizzier",y.fizz-t.fizz,2.5,12,[["eq","High cut","↓"],["drive","Tone","↓"]],[["eq","High cut","↑"]]),
  row("grit","Grit","cleaner","dirtier",y.grit-t.grit,1.5,8,[["drive","Fuzz|Drive","↓"],["amp","Gain","↓"]],[["drive","Fuzz|Drive","↑"],["amp","Gain","↑"]]),
  row("sustain","Sustain","choppier","more squashed",t.dyn-y.dyn,1.5,8,[["dynamics","Ratio","↓"]],[["dynamics","Ratio","↑"],["drive","Fuzz|Drive","↑"]]),
  row("space","Echo / space","drier","wetter",y.space-t.space,2,12,[["delay","Mix","↓"]],[["delay","Mix","↑"],["delay","Feedback","↑"]]),
  row("width","Width","narrower","wider",y.width-t.width,3,15,[["delay","Mix","↓"]],[["delay","Mix","↑"]])]}
const avg2=(o,a,b)=>(o[a]+o[b])/2;
function mixRows(t,y){const T=t.tone_vs_mids_db,Y=y.tone_vs_mids_db;return [
  row("loud","Loudness","quieter","louder",y.loudness.integrated_lufs-t.loudness.integrated_lufs,1,10,[["limiter","Gain","↓"]],[["limiter","Gain","↑"]]),
  row("punch","Punch","squashed","more dynamic",y.loudness.plr_db-t.loudness.plr_db,1.5,8,[["dynamics","Ratio","↑"]],[["limiter","Gain","↓"],["dynamics","Ratio","↓"]]),
  row("lows","Low end","thinner","boomier",avg2(Y,"sub","bass")-avg2(T,"sub","bass"),2.5,12,[["eq","Low shelf","↓"]],[["eq","Low shelf","↑"]]),
  row("mud","Low-mids","thinner","muddier",Y["low-mids"]-T["low-mids"],2,10,[["eq","300 Hz","↓"]],[["eq","300 Hz","↑"]]),
  row("bite","Bite","softer","harsher",Y["upper-mids"]-T["upper-mids"],2,10,[["eq","3 kHz","↓"]],[["eq","3 kHz","↑"]]),
  row("highs","Highs","darker","brighter",avg2(Y,"presence","air")-avg2(T,"presence","air"),2.5,12,[["eq","High shelf","↓"]],[["eq","High shelf","↑"]]),
  row("width","Width","narrower","wider",y.stereo.side_vs_mid_db-t.stereo.side_vs_mid_db,3,15,[["tracks","Pan doubles narrower","↓"]],[["tracks","Pan doubles wider","↑"]])]}

  return {name:`${g[0].toUpperCase()+g.slice(1)} (genre profile)`,genre:g,src:"genre",prof:null,
    ana:{file:g,loudness:{integrated_lufs:-14,plr_db:10,true_peak_dbtp:-1,loudness_range_lu:6},tone_vs_mids_db:t,stereo:{side_vs_mid_db:-10}}}}
function rowsFor(take){const t=C().target;if(!t||!take)return null;
  if(S.ctx==="tone")return t.prof&&take.prof?toneRows(t.prof,take.prof):null;return mixRows(t.ana,take.ana)}
function scoreOf(rows){if(!rows)return null;const m=rows.reduce((a,r)=>a+Math.min(1,Math.max(0,Math.abs(r.diff)-r.tol/2)/r.scale),0)/rows.length;return Math.round(100*(1-m))}

function adviceFor(rows,take){const ch=curChain(),out=[];
  const findSlot=kind=>{for(let si=0;si<ch.strips.length;si++){const i=ch.strips[si].slots.findIndex(s=>s.kind===kind);if(i>=0)return [si,i]}return null};
  if(S.ctx==="mix"&&take){const L=take.ana.loudness;
    if(L.true_peak_dbtp>-1)out.push({kind:"limiter",knob:"Ceiling",dir:"−1 dB",why:`Peaks hit ${L.true_peak_dbtp} dBTP: risky on Spotify`,w:99});
    if(take.ana.stereo.low_end_side_vs_mid_db>-15)out.push({kind:"tracks",knob:"Keep bass & kick centred",dir:"",why:"The low end is spread wide",w:50})}
  for(const r of rows||[]){if(Math.abs(r.diff)<=r.tol)continue;const opts=r.diff>0?r.plus:r.minus;
    const pick=opts.find(o=>o[0]==="tracks"||findSlot(o[0]))||opts[0];
    out.push({kind:pick[0],knob:pick[1],dir:pick[2],amt:amountWord(r),why:`You're ${r.diff>0?r.more:r.less}`,word:r.diff>0?r.more:r.less,w:Math.abs(r.diff)/r.tol,key:r.key})}
  out.sort((a,b)=>b.w-a.w);const seen={},top=out.filter(a=>{const k=a.kind+a.knob;if(seen[k]){seen[k].why+=` and ${a.word}`;return false}seen[k]=a;return true}).slice(0,4);
  top.forEach(a=>{if(a.word)a.why+=" than the target";a.slot=a.kind==="tracks"?null:findSlot(a.kind);a.plugin=a.slot?ch.strips[a.slot[0]].slots[a.slot[1]].plugin:(a.kind==="tracks"?"In your tracks":`Add a ${KIND[a.kind]?.[1]||a.kind} plugin`)});
  return top}

function drawCurve(el,t,y){

   ${labels.map((l,i)=>`<rect class="hit" data-i="${i}" x="${x(i)-iw/(labels.length-1)/2}" y="${m.t}" width="${iw/(labels.length-1)}" height="${ih}" fill="transparent"/>`).join("")}</svg>`;

function knobSVG(p,hot){const a0=-225,a1=45,a=a0+(a1-a0)*Math.max(0,Math.min(1,p)),r=28,c=36;const pt=d=>[c+r*Math.cos(d*Math.PI/180),c+r*Math.sin(d*Math.PI/180)];

/* =============================================================== YOUTUBE */
const YT_={player:null,ready:false,id:null,learning:false,watch:null,apiLoading:false};
function ytId(u){u=(u||"").trim();let m=u.match(/(?:youtu\.be\/|v=|\/shorts\/|\/embed\/|\/live\/)([\w-]{11})/);if(m)return m[1];return /^[\w-]{11}$/.test(u)?u:null}
function ytT(u){const m=(u||"").match(/[?&]t=(\d+h)?(\d+m)?(\d+)s?/);if(!m)return 0;return (parseInt(m[1])||0)*3600+(parseInt(m[2])||0)*60+(parseInt(m[3])||0)}
function parseTime(v){v=String(v||"").trim();if(!v)return null;const p=v.split(":").map(Number);if(p.some(isNaN))return null;return p.reduce((a,x)=>a*60+x,0)}
function fmtTime(s){s=Math.max(0,Math.round(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+":"+String(m).padStart(2,"0"):m)+":"+String(x).padStart(2,"0")}
function ytApi(){return new Promise((res,rej)=>{if(window.YT&&YT.Player)return res();
  window.onYouTubeIframeAPIReady=()=>res();if(YT_.apiLoading)return;YT_.apiLoading=true;
  const s=document.createElement("script");s.src="https://www.youtube.com/iframe_api";s.onerror=()=>rej(new Error("blocked"));document.head.appendChild(s);setTimeout(()=>rej(new Error("timeout")),12000)})}
async function ytOpen(id,start,end){$("yt-msg").textContent="Loading video…";$("yt-wrap").classList.remove("hidden");$("yt-det").open=true;
  $("yt-start").value=fmtTime(start||0);$("yt-end").value=end?fmtTime(end):"";YT_.id=id;store.set("md.yt",{id,start:start||0,end:end||null});
  try{await ytApi()}catch(e){$("yt-msg").textContent=framed()?"YouTube can't load in this embedded copy. Use fiero-fan.github.io/Mix-Doctor.":"Couldn't load YouTube. Check your connection.";return}
  if(YT_.player){YT_.player.cueVideoById({videoId:id,startSeconds:start||0});$("yt-msg").textContent="";return}
  YT_.player=new YT.Player("yt-player",{videoId:id,playerVars:{start:Math.floor(start||0),playsinline:1,rel:0,modestbranding:1},
    events:{onReady:()=>{YT_.ready=true;$("yt-msg").textContent=""},onStateChange:ytState,onError:()=>{$("yt-msg").textContent="This video can't be played embedded. Try another upload of the same song."}}})}
function ytSnip(){const a=parseTime($("yt-start").value)||0,b=parseTime($("yt-end").value);return {a,b:b&&b>a?b:null}}
function ytState(e){if(e.data===1&&YT_.learning==="waiting"){YT_.learning="on";const {a,b}=ytSnip(),len=b?b-a:+($("len-target")?.value||20)||20;
    const title=(YT_.player.getVideoData&&YT_.player.getVideoData().title)||"YouTube clip";
    startCapture("target",len,()=>{try{YT_.player.pauseVideo()}catch(x){}YT_.learning=false;$("yt-msg").textContent="Learned ✓ Now play yourself in step 2."}).then(ok=>{
      if(ok&&L.cap){L.cap.name=`${title.length>44?title.slice(0,42).trim()+"…":title} (${fmtTime(a)}–${fmtTime(a+len)})`;L.cap.yt={id:YT_.id,start:a,end:a+len}}
      else{YT_.learning=false;try{YT_.player.pauseVideo()}catch(x){}}})}}
function ytPlaySnippet(){if(!YT_.ready)return;const {a,b}=ytSnip();YT_.player.seekTo(a,true);YT_.player.playVideo();clearInterval(YT_.watch);
  if(b)YT_.watch=setInterval(()=>{try{if(YT_.player.getCurrentTime()>=b&&!YT_.learning){YT_.player.pauseVideo();clearInterval(YT_.watch)}}catch(e){}},200)}
$("yt-load").onclick=()=>{const u=$("yt-url").value,id=ytId(u);if(!id){$("yt-msg").textContent="That doesn't look like a YouTube link.";$("yt-wrap").classList.remove("hidden");return}ytOpen(id,ytT(u),null)};
$("yt-url").onkeydown=e=>{if(e.key==="Enter")$("yt-load").click()};
document.querySelectorAll("[data-now]").forEach(b=>b.onclick=()=>{if(!YT_.ready)return;$("yt-"+b.dataset.now).value=fmtTime(YT_.player.getCurrentTime());saveSnip()});
function saveSnip(){if(YT_.id){const {a,b}=ytSnip();store.set("md.yt",{id:YT_.id,start:a,end:b})}}
$("yt-start").onchange=saveSnip;$("yt-end").onchange=saveSnip;
$("yt-play").onclick=ytPlaySnippet;
$("yt-learn").onclick=async()=>{if(!YT_.ready){$("yt-msg").textContent="Load a video first.";return}
  if(!L.ctx){try{await connect()}catch(e){$("yt-msg").textContent="Connect the input first (top right).";return}}
  YT_.learning="waiting";$("yt-msg").textContent="Playing the snippet and listening…";const {a}=ytSnip();YT_.player.seekTo(a,true);YT_.player.playVideo()};
{const last=store.get("md.yt",null);if(last&&last.id){$("yt-url").value="https://youtu.be/"+last.id;$("yt-start").value=fmtTime(last.start||0);$("yt-end").value=last.end?fmtTime(last.end):"";$("yt-wrap").classList.remove("hidden");
  ytOpen(last.id,last.start||0,last.end||null)}}

/* ================================================================= LOOP */
function tick(){const m=momentary();$("in-lvl").style.width=(m==null?0:Math.max(0,Math.min(100,(m+50)/50*100)))+"%";
  const c=L.cap;if(c){const p=$("prog-"+c.role),t=$("progt-"+c.role),sec=c.n/(L.sr||48000);
    if(p)p.style.width=(c.untilStop?Math.min(100,sec/300*100):Math.min(100,c.n/c.max*100))+"%";
    if(t)t.textContent=`Listening… ${Math.floor(sec)} s${c.untilStop?" (press Stop when done)":""}${m!=null&&m<-55?" · no sound coming in":""}`}
  requestAnimationFrame(tick)}
$("in-btn").onclick=async()=>{if(L.ctx){disconnect();return}try{await connect()}catch(e){$("in-name").textContent=framed()?"Inputs blocked here":"Access blocked"}};
$("in-dev").onchange=e=>connect(e.target.value).catch(()=>{});
$("ctx-tone").onclick=()=>{S.ctx="tone";store.set("md.ctx","tone");S.sel=[0,0];S.userPicked=false;render()};
$("ctx-mix").onclick=()=>{S.ctx="mix";store.set("md.ctx","mix");S.sel=[0,0];S.userPicked=false;render()};
window.addEventListener("resize",()=>renderCompare());
if(framed())$("env").textContent="Live input doesn't work in this embedded copy. Use fiero-fan.github.io/Mix-Doctor in Chrome for the live features.";
render();requestAnimationFrame(tick);
window.__md={S,L,profileFrom,analyzeBuffer,toneRows,adviceFor,finishCapture};
</script>
